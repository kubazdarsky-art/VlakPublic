<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cyberpunk Vlak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: jedno herní plátno 800x600 uprostřed, pod ním ovládací lišta a nápověda.
   Záměrně jen tmavý neonový vzhled (jako původní hra), proto bez světlého režimu. */
:root {
  --bg: #07070d;
  --panel: #12121f;
  --line: #262640;
  --fg: #c8d2e6;
  --muted: #7c86a0;
  --accent: #00c8ff;
  --accent-ink: #04141c;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); }
body {
  margin: 0;
  color: var(--fg);
  font-family: var(--font);
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.wrap { width: min(100%, 800px); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 4 / 3;
  background: #0a0a12;
  border: 1px solid var(--line);
  border-radius: 6px;
  touch-action: none;
  outline: none;
}
.bar { display: flex; flex-wrap: wrap; gap: 8px; }
button {
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 9px 14px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[hidden] { display: none; }
.help { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); }
kbd {
  font: inherit; font-size: 12px; color: var(--fg);
  background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px;
}
</style>

<div class="wrap">
  <canvas id="c" width="800" height="600" tabindex="0" aria-label="Herní plocha Cyberpunk Vlak"></canvas>
  <div class="bar">
    <button id="bPauza" type="button">Pauza</button>
    <button id="bOdpoj" type="button">Odpoj vagon</button>
    <button id="bLaser" type="button" hidden>Laser</button>
    <button id="bMenu" type="button">Menu</button>
  </div>
  <p class="help">
    Řízení: <kbd>šipky</kbd> nebo <kbd>WASD</kbd>, na dotykovém displeji tah prstem.
    <kbd>Mezerník</kbd> laser (mód 2), <kbd>Shift</kbd> odpojí poslední vagon (−1 bod),
    <kbd>P</kbd> nebo <kbd>Esc</kbd> pauza. V menu přepínáš módy klávesami <kbd>1</kbd>–<kbd>9</kbd> nebo klepnutím,
    <kbd>Enter</kbd> spustí hru.
  </p>
</div>

  for (let i = 0; i < pocet; i++) castice.push({ x: x + B / 2, y: y + B / 2, dx: rnd(-5, 5), dy: rnd(-5, 5), zivot: rint(10, 30), barva, velikost: rint(3, 7) });
}
function pridejText(text, x, y, barva) { texty.push({ text, x, y, vyvyseni: 0, zivot: 30, barva }); }
function updateEfekty(f) {
  for (const c of castice) { c.x += c.dx * f; c.y += c.dy * f; c.zivot -= f; }
  castice = castice.filter(c => c.zivot > 0);
  for (const s of stopy) s.zivot -= f;
  stopy = stopy.filter(s => s.zivot > 0);
  for (const t of texty) { t.zivot -= f; t.vyvyseni += f; }
  texty = texty.filter(t => t.zivot > 0);
}
function drawEfekty() {
  for (const c of castice) {
    ctx.globalAlpha = Math.min(1, c.zivot * 12 / 255);
    circle(c.x, c.y, c.velikost, c.barva);
  }
  for (const s of stopy) {
    ctx.globalAlpha = Math.min(150, s.zivot * 30) / 255;
    fillRR(s.x + 2, s.y + 2, B - 4, B - 4, 4, BARVA_VAGONKU);

  for (const t of texty) {

  const obs = g.vlak.map(v => [v[0], v[1]]);

function zmenSmer(klic) { // klic: UP/DOWN/LEFT/RIGHT
  if (state !== "game" || paused || !G) return;
  const g = G;
  if (has(g.ledy, g.vlak[0][0], g.vlak[0][1])) return;
  const otraven = config.jed && gt < g.otravenoDo;
  const inv = { NAHORU: "DOLU", DOLU: "NAHORU", DOLEVA: "DOPRAVA", DOPRAVA: "DOLEVA" };
  const mapa = { UP: "NAHORU", DOWN: "DOLU", LEFT: "DOLEVA", RIGHT: "DOPRAVA" };

function pozice(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
}
canvas.addEventListener("click", (e) => {
  canvas.focus({ preventScroll: true });
  const [x, y] = pozice(e);
  if (state === "menu") {
    CFG_KEYS.forEach((k, i) => { const yy = 115 + i * 38; if (x >= 70 && x <= 730 && y >= yy - 4 && y <= yy + 26) config[k] = !config[k]; });
    if (x >= 70 && x <= 730 && y >= 485 && y <= 521) startHra();
  } else if (state === "over") doMenu();
  else if (state === "game" && paused) pauza();
});
let tx = 0, ty = 0, tOn = false;
canvas.addEventListener("touchstart", (e) => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; tOn = true; }, { passive: true });
canvas.addEventListener("touchmove", (e) => {
  if (!tOn) return;
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  zmenSmer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "RIGHT" : "LEFT") : (dy > 0 ? "DOWN" : "UP"));
  tx = t.clientX; ty = t.clientY;
}, { passive: true });
canvas.addEventListener("touchend", () => { tOn = false; }, { passive: true });

const bPauza = document.getElementById("bPauza"), bOdpoj = document.getElementById("bOdpoj"), bLaser = document.getElementById("bLaser"), bMenu = document.getElementById("bMenu");
function syncButtons() {
  bPauza.textContent = paused ? "Pokračovat" : "Pauza";
  bPauza.hidden = bOdpoj.hidden = state !== "game";
  bLaser.hidden = !(state === "game" && config.zbrane);
  bMenu.hidden = state === "menu";
}
bPauza.addEventListener("click", pauza);
bOdpoj.addEventListener("click", odpoj);
bLaser.addEventListener("click", laser);
bMenu.addEventListener("click", doMenu);
document.addEventListener("visibilitychange", () => { if (document.hidden && state === "game" && !paused) pauza(); });
window.addEventListener("blur", () => { if (state === "game" && !paused) pauza(); });

// ---------- Krok hry (1 krok = 1 snímek původní hry) ----------
function step() {
  const g = G, cfg = config;
  const hl = () => g.vlak[0];

  if (g.kombo > 1 && gt > g.komboCas) { g.kombo = 1; pridejText("Combo Reset", hl()[0], hl()[1], "rgb(255,100,100)"); }

  if (g.skore >= g.dalsiLevel) {
    g.level++; g.dalsiLevel += 10; g.levelUpCas = gt + 2500; g.rychlost += 1.0;
    for (let i = 0; i < 5; i++) vybuch(rint(100, W - 100), rint(100, H - 100), "rgb(255,215,0)", 20);
    for (let i = 0; i < 2; i++) {
      const zed = generuj(g.vlak.map(v => [v[0], v[1]]).concat(g.prekazky, g.ledy, g.portaly, g.turbace, g.barely));
      g.prekazky.push(zed); vybuch(zed[0], zed[1], BARVA_ZDI, 25);
    }
  }

  g.smer = g.novySmer;

  const obsAkt = g.vlak.map(v => [v[0], v[1]]).concat(g.prekazky, g.ledy, g.portaly, g.turbace, g.barely, [g.jidloPozice]);
  if (cfg.jed && !g.jedPozice && Math.random() < 0.02) g.jedPozice = generuj(obsAkt);
  if (cfg.bonusy && !g.specialPozice && Math.random() < 0.03) {
    g.specialPozice = generuj(obsAkt);
    g.specialTyp = Math.random() < 0.5 ? "PILULKA" : "DUCH";
    g.specialKonec = gt + 6000;
  } else if (g.specialPozice && gt > g.specialKonec) g.specialPozice = null;

  if (g.duch && gt > g.duchKonec) g.duch = false;

  if (cfg.lovec && gt > g.lovecZmrazenDo) {
    g.lovecX += g.lovecDx; g.lovecY += g.lovecDy;
    if (g.lovecX < 0 || g.lovecX >= W) { g.lovecDx *= -1; g.lovecX += g.lovecDx * 2; }
    if (g.lovecY < 0 || g.lovecY >= H) { g.lovecDy *= -1; g.lovecY += g.lovecDy * 2; }
  }

  // Výstřely
  const nove = [];
  for (const v of g.vystrely) {
    v[0] += v[2] * 2; v[1] += v[3] * 2;
    let trefa = false;
    for (const b of g.barely.slice()) {
      if (ov(v[0], v[1], b[0], b[1])) {
        trefa = true; odeber(g.barely, b);
        vybuch(b[0], b[1], "rgb(255,150,0)", 40);
        pridejText("BOMBA!", b[0], b[1], "rgb(255,100,0)");
        const dosah = B * 3;
        g.prekazky = g.prekazky.filter(z => {
          if (Math.hypot(z[0] - b[0], z[1] - b[1]) <= dosah) { vybuch(z[0], z[1], BARVA_ZDI, 10); g.skore++; return false; }
          return true;
        });
        if (cfg.lovec && Math.hypot(g.lovecX - b[0], g.lovecY - b[1]) <= dosah) {
          g.lovecZmrazenDo = gt + 6000; vybuch(g.lovecX, g.lovecY, "rgb(0,100,255)");
        }
        break;
      }
    }
    if (trefa) continue;
    for (const z of g.prekazky.slice()) {
      if (ov(v[0], v[1], z[0], z[1])) { vybuch(z[0], z[1], "rgb(255,100,0)"); odeber(g.prekazky, z); trefa = true; break; }
    }
    if (cfg.lovec && ov(v[0], v[1], g.lovecX, g.lovecY)) {
      g.lovecZmrazenDo = gt + 4000; vybuch(g.lovecX, g.lovecY, "rgb(0,100,255)"); trefa = true;
    }
    if (!trefa && v[0] >= 0 && v[0] < W && v[1] >= 0 && v[1] < H) nove.push(v);
  }
  g.vystrely = nove;

  // Pohyb hlavy
  let hx = hl()[0], hy = hl()[1];
  stopy.push({ x: hx, y: hy, zivot: 5 });
  if (g.smer === "NAHORU") hy -= B; else if (g.smer === "DOLU") hy += B;
  else if (g.smer === "DOLEVA") hx -= B; else hx += B;
  hx = ((hx % W) + W) % W; hy = ((hy % H) + H) % H;

  if (cfg.portaly && g.portalCooldown === 0) {
    const p = g.portaly;
    if (hx === p[0][0] && hy === p[0][1]) { hx = p[1][0]; hy = p[1][1]; g.portalCooldown = 2; }
    else if (hx === p[1][0] && hy === p[1][1]) { hx = p[0][0]; hy = p[0][1]; g.portalCooldown = 2; }
  }
  if (g.portalCooldown > 0) g.portalCooldown--;

  g.vlak.unshift([hx, hy, null]);

  // Jídlo
  if (hx === g.jidloPozice[0] && hy === g.jidloPozice[1]) {
    const zisk = g.kombo;
    g.skore += zisk;
    pridejText("+" + zisk + (g.kombo > 1 ? " (" + g.kombo + "x Combo!)" : ""), g.jidloPozice[0], g.jidloPozice[1], "rgb(100,255,100)");
    g.kombo = Math.min(5, g.kombo + 1);
    g.komboCas = gt + g.KOMBO_OKNO;
    g.vlak[1][2] = g.jidloIndex;
    vybuch(g.jidloPozice[0], g.jidloPozice[1], "rgb(0,255,100)");
    g.jidloPozice = generuj(g.vlak.map(v => [v[0], v[1]]).concat(g.prekazky, g.ledy, g.portaly, g.turbace, g.barely));
    g.jidloIndex = nahodneJidlo();
    g.rychlost += RYCHLOST_NARUST;
  } else g.vlak.pop();

  if (cfg.turbo && has(g.turbace, hx, hy)) {
    g.turboDo = gt + 2000; vybuch(hx, hy, BARVA_TURBO); pridejText("TURBO BOOST!", hx, hy, BARVA_TURBO);
  }
  if (g.jedPozice && hx === g.jedPozice[0] && hy === g.jedPozice[1]) {
    g.otravenoDo = gt + 5000; vybuch(g.jedPozice[0], g.jedPozice[1], "rgb(200,0,200)"); g.jedPozice = null;
    pridejText("Zmatení!", hx, hy, "rgb(200,0,200)");
  }
  if (cfg.bonusy && g.specialPozice && hx === g.specialPozice[0] && hy === g.specialPozice[1]) {
    if (g.specialTyp === "PILULKA") { g.rychlost = RYCHLOST_START + g.level * 0.5; pridejText("Rychlost stabilizována", hx, hy, "rgb(0,255,255)"); }
    else { g.duch = true; g.duchKonec = gt + 6000; pridejText("Fázování aktivní!", hx, hy, "rgb(255,255,255)"); }
    vybuch(g.specialPozice[0], g.specialPozice[1], "rgb(0,255,255)"); g.specialPozice = null;
  }

  // Kolize
  if (has(g.barely, hx, hy) && !g.duch) return false;
  if (cfg.lovec && ov(hx, hy, g.lovecX, g.lovecY) && !g.duch) return false;
  if (!g.duch && g.vlak.slice(1).some(v => v[0] === hx && v[1] === hy)) return false;
  if (has(g.prekazky, hx, hy)) {
    if (g.duch) {
      g.prekazky = g.prekazky.filter(p => !(p[0] === hx && p[1] === hy));
      g.skore++; vybuch(hx, hy, "rgb(255,255,255)"); pridejText("+1", hx, hy, BARVA_TEXTU);
    } else return false;
  }
  return true;
}

function konecHry() {
  if (G.skore > highscore) { highscore = G.skore; ulozit("vlak.highscore", String(highscore)); }
  state = "over"; syncButtons();
}

// ---------- Vykreslení ----------
function drawMenu(t) {
  ctx.fillStyle = "rgb(12,12,22)"; ctx.fillRect(0, 0, W, H);
  const puls = Math.round(210 + 45 * Math.sin(t / 180));
  txt("CYBERPUNK VLAK", 70, 22, "rgb(0," + puls + ",255)", 50, true);
  line(70, 90, 730, 90, "rgb(0,120,200)", 2);
  const polozky = [
    ["1", "Zkažené jídlo (Obrácené ovládání)", "jed"],
    ["2", "Ozbrojený vlak (Mezerník = Laser)", "zbrane"],
    ["3", "Červí díry (Teleportační portály)", "portaly"],
    ["4", "Zrádný terén (Ledové plochy)", "led"],
    ["5", "Lovec na mapě (Pronásledovatel)", "lovec"],
    ["6", "Speciální bonusy (Pilulka & Duch)", "bonusy"],
    ["7", "Noční režim (Omezená viditelnost)", "tma"],
    ["8", "Zrychlovací pásy (Zlaté Turbo)", "turbo"],
    ["9", "Výbušné barely (Řetězová reakce)", "barely"],
  ];
  polozky.forEach(([kl, nazev, k], i) => {
    const y = 115 + i * 38, on = config[k];
    fillRR(70, y - 4, 660, 30, 4, "rgb(20,20,35)");
    txt("[" + kl + "]", 85, y, "rgb(0,200,255)", 20);
    txt(nazev, 130, y, BARVA_TEXTU, 20);
    const s = on ? " AKTIVNÍ " : " VYPNUTO ";
    ctx.font = "20px " + FONT;
    const w = ctx.measureText(s).width;
    fillRR(710 - w - 5, y - 2, w + 10, 28, 4, on ? "rgb(0,40,20)" : "rgb(40,10,10)");
    txt(s, 710, y, on ? "rgb(0,255,140)" : "rgb(255,70,70)", 20, false, "right");
  });
  const ps = Math.round(180 + 75 * Math.abs(Math.sin(t / 300)));
  fillRR(70, 485, 660, 36, 4, "rgb(30,30,12)");
  txt("[ ENTER ]  Start mise", W / 2, 494, "rgb(" + ps + "," + ps + ",50)", 20, true, "center");
  txt("Pamatuje si poslední nastavení  |  Rekord: " + highscore, 70, 535, "rgb(100,110,130)", 18);
}

function drawGame(t) {
  const g = G, cfg = config;
  const otraven = cfg.jed && gt < g.otravenoDo, vTurbu = cfg.turbo && gt < g.turboDo;
  ctx.fillStyle = BARVA_POZADI; ctx.fillRect(0, 0, W, H);

  const pm = Math.round(8 * Math.sin(gt / 250));
  const r = Math.min(255, 10 + g.level * 25), gg = Math.min(255, 10 + (g.level * 15) % 100), b = Math.min(255, 20 + (g.level * 40) % 150);
  const sit = "rgb(" + Math.max(10, r + pm) + "," + Math.max(10, gg + pm) + "," + Math.max(20, b + pm) + ")";
  for (let x = 0; x < W; x += B) line(x + 0.5, 0, x + 0.5, H, sit, 1);
  for (let y = 0; y < H; y += B) line(0, y + 0.5, W, y + 0.5, sit, 1);

  for (const l of g.ledy) fillRR(l[0] + 2, l[1] + 2, B - 4, B - 4, 6, BARVA_LED);

  for (const tb of g.turbace) {
    fillRR(tb[0] + 2, tb[1] + 2, B - 4, B - 4, 4, "rgb(40,35,10)");
    ctx.beginPath(); ctx.moveTo(tb[0] + 10, tb[1] + 30); ctx.lineTo(tb[0] + 20, tb[1] + 10); ctx.lineTo(tb[0] + 30, tb[1] + 30); ctx.closePath();
    ctx.fillStyle = BARVA_TURBO; ctx.fill();
  }

  if (cfg.portaly) {
    const pp = 3 * Math.sin(gt / 100);
    [["rgb(255,140,0)", 0], ["rgb(0,150,255)", 1]].forEach(([c, i]) => {
      ctx.beginPath(); ctx.arc(g.portaly[i][0] + 20, g.portaly[i][1] + 20, 14 + pp, 0, Math.PI * 2);
      ctx.strokeStyle = c; ctx.lineWidth = 4; ctx.stroke();
    });
  }

  for (const z of g.prekazky) {
    fillRR(z[0] + 1, z[1] + 1, B - 2, B - 2, 4, BARVA_ZDI);
    ctx.fillStyle = "rgb(40,40,50)"; ctx.fillRect(z[0] + 5, z[1] + 5, B - 10, B - 10);
  }

  for (const br of g.barely) {
    fillRR(br[0] + 4, br[1] + 2, B - 8, B - 4, 5, BARVA_BAREL);
    line(br[0] + 4, br[1] + 14, br[0] + B - 5, br[1] + 14, "rgb(20,20,20)", 3);
    line(br[0] + 4, br[1] + 26, br[0] + B - 5, br[1] + 26, "rgb(20,20,20)", 3);
  }

  for (const v of g.vystrely) circle(v[0] + 20, v[1] + 20, 6, "rgb(255,255,100)");

  if (ok(imgJidlo[g.jidloIndex])) ctx.drawImage(imgJidlo[g.jidloIndex], g.jidloPozice[0], g.jidloPozice[1], B, B);
  else fillRR(g.jidloPozice[0] + 4, g.jidloPozice[1] + 4, B - 8, B - 8, 8, "rgb(255,60,60)");

  if (g.jedPozice) { circle(g.jedPozice[0] + 20, g.jedPozice[1] + 20, 14, "rgb(150,0,230)"); circle(g.jedPozice[0] + 20, g.jedPozice[1] + 20, 8, "rgb(50,255,50)"); }

  if (cfg.bonusy && g.specialPozice) {
    const [sx, sy] = g.specialPozice;
    if (g.specialTyp === "PILULKA") { if (ok(imgPilulka)) ctx.drawImage(imgPilulka, sx, sy, B, B); else circle(sx + 20, sy + 20, 14, "rgb(0,255,255)"); }
    else { if (ok(imgDuch)) ctx.drawImage(imgDuch, sx, sy, B, B); else circle(sx + 20, sy + 20, 14, "rgb(230,230,255)"); }
  }

  if (cfg.lovec) {
    if (gt < g.lovecZmrazenDo) fillRR(g.lovecX + 3, g.lovecY + 3, B - 6, B - 6, 6, "rgb(0,100,255)");
    else if (ok(imgLovec)) ctx.drawImage(imgLovec, g.lovecX, g.lovecY, B, B);
    else fillRR(g.lovecX + 2, g.lovecY + 2, B - 4, B - 4, 6, "rgb(220,20,60)");
  }

  drawEfekty();

  g.vlak.forEach((blok, i) => {
    const [bx, by, idx] = blok;
    if (g.duch) strokeRR(bx - 2, by - 2, B + 4, B + 4, 8, "rgb(0,255,255)", 2);
    if (i === 0) {
      if (ok(imgHlava)) {
        ctx.save(); ctx.translate(bx + B / 2, by + B / 2); ctx.rotate(ROT[g.smer]);
        ctx.drawImage(imgHlava, -B / 2, -B / 2, B, B); ctx.restore();
      } else fillRR(bx + 1, by + 1, B - 2, B - 2, 10, "rgb(0,230,120)");
    } else if (idx !== null && ok(imgJidlo[idx])) ctx.drawImage(imgJidlo[idx], bx, by, B, B);
    else fillRR(bx + 2, by + 2, B - 4, B - 4, 6, vTurbu ? BARVA_TURBO : BARVA_VAGONKU);
  });

  if (cfg.tma) {
    tctx.globalCompositeOperation = "source-over";
    tctx.fillStyle = "rgb(5,5,10)"; tctx.fillRect(0, 0, W, H);
    tctx.globalCompositeOperation = "destination-out";
    tctx.beginPath(); tctx.arc(g.vlak[0][0] + 20, g.vlak[0][1] + 20, 125, 0, Math.PI * 2); tctx.fill();
    tctx.globalCompositeOperation = "source-over";
    ctx.drawImage(tma, 0, 0, W, H);
  }

  if (gt < g.levelUpCas) {
    ctx.globalAlpha = Math.max(0, 1 - (gt - (g.levelUpCas - 2500)) / 2500);
    txt("LEVEL " + g.level + "!", W / 2, H / 3 - 35, "rgb(255,215,0)", 70, true, "center");
    ctx.globalAlpha = 1;
  }

  txt("Skóre: " + g.skore + "  |  Level: " + g.level + "  |  Rekord: " + Math.max(highscore, g.skore), 15, 15, otraven ? "rgb(255,50,50)" : BARVA_TEXTU, 20);
  if (cfg.zbrane) {
    const ready = gt > g.dalsiVystrel;
    txt("Laser: " + (ready ? "READY" : "LOADING"), 15, 45, ready ? "rgb(255,220,0)" : "rgb(100,100,100)", 20);
  }
  if (g.kombo > 1) {
    const sirka = Math.round(120 * Math.max(0, g.komboCas - gt) / g.KOMBO_OKNO);
    fillRR(W - 140, 20, 120, 10, 3, "rgb(40,40,60)");
    if (sirka > 0) fillRR(W - 140, 20, sirka, 10, 3, "rgb(0,255,150)");
    txt("COMBO " + g.kombo + "x", W - 140, 35, "rgb(0,255,150)", 16, true);
  }

  if (paused) {
    ctx.fillStyle = "rgba(5,5,12,0.7)"; ctx.fillRect(0, 0, W, H);
    txt("PAUZA", W / 2, H / 2 - 40, "rgb(0,200,255)", 50, true, "center");
    txt("P / Esc / klepnutí = pokračovat", W / 2, H / 2 + 25, "rgb(130,130,150)", 18, false, "center");
  }
}

function drawOver(t) {
  ctx.fillStyle = "rgb(10,10,15)"; ctx.fillRect(0, 0, W, H);
  const p = Math.round(200 + 55 * Math.sin(t / 150));
  txt("GAME OVER", W / 2, H / 2 - 105, "rgb(" + p + ",40,40)", 50, true, "center");
  txt("Dosažené skóre: " + G.skore + " (Level " + G.level + ")  |  Nejvyšší skóre: " + highscore, W / 2, H / 2 - 12, BARVA_TEXTU, 20, false, "center");
  txt("MEZERNÍK / klepnutí = Menu  |  R = znovu", W / 2, H / 2 + 48, "rgb(130,130,150)", 20, false, "center");
}

// ---------- Hlavní smyčka ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(now - last, 100); last = now;
  updateEfekty(paused ? 0 : dt / 50);
  if (state === "game" && !paused) {
    gt += dt; acc += dt;
    let n = 0;
    while (state === "game") {
      const v = G.rychlost * (config.turbo && gt < G.turboDo ? 1.8 : 1);
      const interval = 1000 / v;
      if (acc < interval || n >= 3) break;
      acc -= interval; n++;
      if (!step()) { konecHry(); break; }
    }
    if (n >= 3) acc = 0;
  }
  ctx.globalAlpha = 1;
  if (state === "menu") drawMenu(now);
  else if (state === "game") drawGame(now);
  else drawOver(now);
  requestAnimationFrame(frame);
}
syncButtons();
requestAnimationFrame(frame);
})();
</script>
